<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TÍTULO DE LA PESTAÑA DEL NAVEGADOR -->
    <title>CHARMERRR.SITE</title>

    <style>
        /* CONFIGURACIÓN DE FUENTES */
        @import url('https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0d0d0d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            font-family: 'Stalinist One', sans-serif; /* Fuente para el párrafo */
        }

        /* FONDO DE RUIDO DIGITAL */
        .noise-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* CONTENEDOR CENTRAL */
        .main-container {
            text-align: center;
            max-width: 600px; /* Evita que el texto choque con las imágenes */
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-family: 'Stalinist One', sans-serif; /* Fuente que elegirás */
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #00ffcc; /* Un color llamativo */
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cccccc;
            text-align: center;
        }

        /* IMÁGENES LATERALES */
        .side-img {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 15vw; /* Tamaño relativo al ancho de pantalla */
            min-width: 120px;
            pointer-events: none;
        }

        .left { left: 3%; }
        .right { right: 3%; }

        /* ANIMACIÓN FLOTANTE */
        @keyframes float {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-60%) translateX(5px); }
        }

        .floating {
            animation: float 5s ease-in-out infinite;
        }

        .right { animation-delay: 1.5s; }

        /* Ajuste para celulares */
        @media (max-width: 768px) {
            .side-img { display: none; } /* Oculta imágenes en móvil para que no tapen el texto */
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="noise-bg"></div>

    <!-- IMÁGENES LATERALES -->
    <img src="https://i.postimg.cc/CzHjPgCX/jf5ql9wfy0381.jpg" alt="Izquierda" class="side-img left floating">
    <img src="https://i.postimg.cc/CzHjPgCX/jf5ql9wfy0381.jpg" alt="Derecha" class="side-img right floating">

    <!-- CONTENIDO CENTRAL -->
    <div class="main-container">
        <h1>"CHARMERRR!"</h1> <!-- AQUÍ VA TU TÍTULO VISIBLE -->
        
        <p> 
            "EL QUE NO COMPRA EL BOLETO NO GANA LA LOTERIA"
            NUNCA NADIE DIJO QUE IBA A SER FACIL,
            AVECES HAY QUE DETONARSE A LO MISIL,
            PRIMERO ES LA FAMILIA, IMBECIL.
            NO SE TE OCURRA HACERLO A LO FUGAZZI. 
        </p>
    </div>

</body>
</html>
